{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm" style="max-width: 480px; margin: 2rem auto;">
    <h2 class="mb-3">Reset your password</h2>
    <p class="text-muted">Enter your email address and we’ll send you instructions to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_email" class="form-label">Email</label>
            {{ form.email }}
        </div>
        <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>
</div>
{% endblock %}
