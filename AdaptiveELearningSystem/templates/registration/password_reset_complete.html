{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm" style="max-width: 480px; margin: 2rem auto;">
    <h2 class="mb-3">Password reset complete</h2>
    <p>Your password has been set successfully. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary">Go to login</a>
</div>
{% endblock %}
