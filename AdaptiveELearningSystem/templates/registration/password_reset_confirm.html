{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm" style="max-width: 480px; margin: 2rem auto;">
    <h2 class="mb-3">Set a new password</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_new_password1" class="form-label">New password</label>
            {{ form.new_password1 }}
        </div>
        <div class="mb-3">
            <label for="id_new_password2" class="form-label">Confirm password</label>
            {{ form.new_password2 }}
        </div>
        <button type="submit" class="btn btn-primary">Save new password</button>
    </form>
</div>
{% endblock %}
