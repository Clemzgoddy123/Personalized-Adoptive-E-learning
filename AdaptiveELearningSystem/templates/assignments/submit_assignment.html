{% extends 'base.html' %}
{% block title %}Submit Assignment{% endblock %}
{% block content %}
<h2>Submit Assignment</h2>
<p><strong>Assignment:</strong> {{ assignment.title }}</p>
<p><strong>Course:</strong> <a href="/courses/{{ assignment.course.id }}/">{{ assignment.course.title }}</a></p>
{% if message %}
    <div class="alert alert-warning">{{ message }}</div>
{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
        <label for="submission_file" class="form-label">Upload submission</label>
        <input type="file" class="form-control" id="submission_file" name="submission_file" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
