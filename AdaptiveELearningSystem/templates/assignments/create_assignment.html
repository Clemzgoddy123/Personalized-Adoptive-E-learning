{% extends 'base.html' %}
{% block title %}Create Assignment{% endblock %}
{% block content %}
<h2>Create Assignment</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="4"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Course</label>
        <select name="course" class="form-select" required>
            <option value="">Select a course</option>
            {% for course in courses %}
                <option value="{{ course.id }}">{{ course.title }} — {{ course.class_level }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Deadline</label>
        <input type="datetime-local" name="deadline" class="form-control" required>
        <div class="form-text">Use your local date & time picker.</div>
    </div>
    <div class="mb-3">
        <label class="form-label">Max Score</label>
        <input type="number" name="max_score" class="form-control" min="1" value="100">
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
    <a href="{% url 'assignment_list' %}" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
